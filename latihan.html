<!-- Form Page -->
<html>
<head>
    <title>UH PRAKREK</title>
   <style type="text/css" media="all">
body {
    background-color: pink;
    color: black;
    text-align: center;
}

table {
    width: 300px;
    height: 500px;
    background-color: #8FBC8F;
    margin: 0 auto;
}

th {
    background-color: #FFEBCD;
}

input[type="text"],
input[type="date"],
input[type="password"],
select {
    width: 100%;
    padding: 5px;
    margin: 5px 0;
}

button {
    padding: 10px 20px;
    background-color: #4CAF50;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background-color: #45a049;
}

h1 {
    margin: 20px 0;
}

marquee {
    color: black;
}
   </style>
</head>
<body>
    <h1>ULANGAN PRAKTEK HTML</h1>
    <form style="background-image: url(https://i2.wp.com/decyra.com/wp-content/uploads/2019/05/kebun-bunga-mawar-pink-2.jpg?resize=720%2C420&ssl=1); margin-top: 60px; padding-top: 50px; padding-bottom: 50px;">
        <table>
            <tr>
                <th colspan="2">FORMULIR PENDAFTARAN</th>
            </tr>
            <tr>
                <td>Nama</td>
                <td><input type="text" name="nama" value="Your Name"></td>
            </tr>
            <tr>
                <td>Username</td>
                <td><input type="text" name="username" value="Username"></td>
            </tr>
            <tr>
                <td>Tanggal Lahir</td>
                <td><input type="date" name="t1"></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="text" name="email" value="Your Email"></td>
            </tr>
            <tr>
                <td>Jenis Kelamin</td>
                <td>
                    <input type="radio" name="gender" value="Laki-Laki" checked>Laki-Laki
                    <input type="radio" name="gender" value="Perempuan">Perempuan
                </td>
            </tr>
            <tr>
                <td>Agama</td>
                <td>
                    <select name="agama">
                        <option value="islam">ISLAM</option>
                        <option value="katolik">KATOLIK</option>
                        <option value="protestan">PROTESTAN</option>
                        <option value="buddha">BUDDHA</option>
                        <option value="hindu">HINDU</option>
                        <option value="konghucu">KONGHUCU</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password" name="PS"></td>
            </tr>
            <tr>
                <td colspan="2" style="text-align: center;">
                    <a href="latihan1.html"><button type="submit">DAFTAR</button></a>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
